name: Check for Screen Update

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_latest.outputs.version }}
      pkg: ${{ steps.get_latest.outputs.pkg }}
      current: ${{ steps.current.outputs.current }}
      update_needed: ${{ steps.compare.outputs.update_needed }}
    steps:
      - uses: actions/checkout@v4

      - name: Get latest version from Slackware
        id: get_latest
        run: |
          mirrors="https://slackware.uk/slackware/slackware64-current https://mirrors.slackware.com/slackware/slackware64-current https://slackware.osuosl.org/slackware64-current"

          for m in $mirrors; do
            wget -q -O CHECKSUMS.md5 "$m/CHECKSUMS.md5" && break
          done

          pkg="$(
            awk -v arch="x86_64" '
              {
                path=$2
                sub(/^[.]\//, "", path)
                if (path ~ "^slackware64/ap/screen-[0-9]+([.][0-9]+)+-" arch "-[0-9]+[.]txz$" ||
                    path ~ "^ap/screen-[0-9]+([.][0-9]+)+-" arch "-[0-9]+[.]txz$") {
                  file=path
                  sub(/^.*\//, "", file)
                  print file
                }
              }
            ' CHECKSUMS.md5 | sort -V | tail -n 1
          )"

          rm -f CHECKSUMS.md5

          if [ -z "$pkg" ]; then
            echo "Could not determine latest version"
            exit 1
          fi

          pkg="${pkg%.txz}"
          version="${pkg#screen-}"
          version="${version%-x86_64-*}"

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "pkg=$pkg" >> $GITHUB_OUTPUT
          echo "Found latest version: $version ($pkg.txz)"

      - name: Read current version
        id: current
        run: |
          current=$(tr -d '[:space:]' < latest_version.txt)
          echo "current=$current" >> $GITHUB_OUTPUT
          echo "Current version: $current"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.get_latest.outputs.version }}" != "${{ steps.current.outputs.current }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: ${{ steps.current.outputs.current }} -> ${{ steps.get_latest.outputs.version }}"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "Already at latest version: ${{ steps.current.outputs.current }}"
          fi

      - name: Update files
        if: steps.compare.outputs.update_needed == 'true'
        run: |
          PKG="${{ steps.get_latest.outputs.pkg }}"
          DATE=$(date +%Y.%m.%d)

          # Update latest_version.txt
          echo "${{ steps.get_latest.outputs.version }}" > latest_version.txt

          # Update screenPkgVer in plg file
          sed -i 's|<!ENTITY screenPkgVer  "[^"]*">|<!ENTITY screenPkgVer  "'"${{ steps.get_latest.outputs.version }}"'">|' plugin/Screen-for-Unraid.plg

          # Update plugin version
          CURRENT_PLG_VER=$(grep -oP '<!ENTITY version\s+"[^"]+">' plugin/Screen-for-Unraid.plg | grep -oP '"[^"]+' | tr -d '"')
          sed -i 's|<!ENTITY version     "[^"]*">|<!ENTITY version     "'"$DATE"'">|' plugin/Screen-for-Unraid.plg

          # Add changelog entry after opening <CHANGES> tag in plg file
          line=$(grep -n '<CHANGES>' plugin/Screen-for-Unraid.plg | head -1 | cut -d: -f1)
          sed -i "$((line+1))i\\\\n### $DATE\n- Install ${PKG}.txz with automatic checksum validation and mirror fallback\n" plugin/Screen-for-Unraid.plg

          # Add changelog entry in README.md after "# CHANGE LOG:"
          line=$(grep -n '# CHANGE LOG:' README.md | head -1 | cut -d: -f1)
          sed -i "$((line+1))i\\\\n    ### $DATE\n        - Install ${PKG}.txz with automatic checksum validation and mirror fallback" README.md

          echo "Updated to $PKG.txz (plugin version $DATE)"

      - name: Create Pull Request
        if: steps.compare.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          commit-message: "Update to ${{ steps.get_latest.outputs.pkg }}.txz"
          title: "Update to ${{ steps.get_latest.outputs.pkg }}.txz"
          body: |
            Automated update of Screen to **${{ steps.get_latest.outputs.pkg }}.txz**.

            Source: https://slackware.pkgs.org/current/slackware-x86_64/

            _Generated by the Check for Screen Update workflow._
          branch: update-screen-${{ steps.get_latest.outputs.version }}
          base: main
          labels: automated,update
          delete-branch: true
